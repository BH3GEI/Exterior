name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    name: 内核验收（SPEC §0.5）
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: 编译内核
        run: cargo build --manifest-path kernel/Cargo.toml
      - name: 端到端验收（10 项）
        run: node --test --test-concurrency=1 e2e/kernel/acceptance.test.mjs e2e/kernel/dag.test.mjs
        env:
          KERNEL_BIN: ${{ github.workspace }}/kernel/target/debug/exterior-kernel

  gui:
    name: GUI 验收（SPEC §5.2，tauri-driver + WebdriverIO）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK 与驱动
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 tauri-driver（缓存）
        id: tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - name: 前端依赖
        run: npm ci
      - name: 编译应用
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: GUI 端到端（SPEC §5.2 十场景）
        run: xvfb-run -a node --test --test-concurrency=1 e2e/gui/scenarios.test.mjs
        env:
          CI: "true"
          APP_BIN: ${{ github.workspace }}/src-tauri/target/debug/exterior
      - name: 截图产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: e2e/artifacts/
