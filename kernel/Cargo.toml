[package]
name = "exterior-kernel"
version = "0.1.0"
description = "Rust 版 DeepSeek Harness sdk-minimal 内核（Exterior 第 0 节）"
edition = "2021"

[lib]
name = "exterior_kernel"
path = "src/lib.rs"

[[bin]]
name = "exterior-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
